# sequentialist: one monitor of each kind.
#
#   sequentialist check examples/monitors.toml
#   sequentialist serve examples/monitors.toml
#   curl -s localhost:8080/v1/monitors/api-latency/observations -d '{"values": [0.21, 0.18, 0.25]}'
#
# Which detector to choose: see "Process monitoring and change detection" in the
# documentation of sequential-analysis (docs/tutorials/monitoring.md).

[service]
state_dir = "state"        # relative to this file
host = "127.0.0.1"         # no authentication: keep it on localhost, or behind an authenticating proxy
port = 8080
checkpoint_every = 1000
sync = "fsync"

[[sink]]
type = "log"

[[sink]]
type = "jsonl"
path = "state/alerts.jsonl"

# [[sink]]
# type = "webhook"
# url = "https://alerts.example/hook"
# timeout = 5
# attempts = 5

# Response times in seconds, clipped to [0, 1], mean 0.2 in the steady state.
# Average run length to a false alarm at least 10000 for EVERY distribution
# on [0, 1] with that mean: no normality assumed.
[[monitor]]
name = "api-latency"
description = "mean response time of the API, seconds"
detector = "mean_e_detector"
params = { m = 0.2, lo = 0.0, hi = 1.0, arl = 10000, direction = "increase", statistic = "cusum" }

# The 95th percentile of a heavy-tailed quantity: nothing assumed but the
# percentile itself before the change.
[[monitor]]
name = "checkout-p95"
detector = "quantile_e_detector"
params = { q0 = 0.4744, p = 0.95, arl = 10000, direction = "increase", statistic = "cusum" }

# Errors per minute, Poisson with rate 2 before, 4 after: CUSUM is optimal
# when both are known.
[[monitor]]
name = "errors-per-minute"
detector = "cusum"
params = { family = { family = "poisson" }, theta0 = 2.0, theta1 = 4.0, threshold = 8.0 }

[[monitor]]
name = "queue-wait"
detector = "shiryaev_roberts"
params = { family = { family = "exponential" }, theta0 = 1.0, theta1 = 0.5, threshold = 5000.0 }

# Nothing known about either segment: a posterior over the time since the
# last change, alarming at 90% of a change within the last 20 values.
# No frequentist guarantee on false alarms.
[[monitor]]
name = "cpu-load"
detector = "bayesian_change_point"
params = { model = { model = "normal_gamma", mu0 = 0.5, kappa0 = 1.0, alpha0 = 2.0, beta0 = 0.05 }, hazard = 0.002, alarm_probability = 0.9, alarm_window = 20 }
