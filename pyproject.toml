# Settings of the tools for the whole repository; the packages are in packages/*/pyproject.toml.

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["ts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Unicode in strings and comments is intentional (Russian text, math)
]

[tool.ruff.lint.isort]
known-first-party = ["sequentialist"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*" = ["E731", "RUF012"]

[tool.mypy]
python_version = "3.10"  # mypy checks types only; the code runs on 3.8 (see CI)
mypy_path = "packages/core/src:packages/ab/src"
files = ["packages/core/src/sequentialist", "packages/ab/src/sequentialist"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
