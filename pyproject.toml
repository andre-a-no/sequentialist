[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequentialist"
dynamic = ["version"]
description = "A service that monitors streams of metrics with sequential change-point detectors from sequential-analysis"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"  # tomllib
authors = [
    { name = "Andrej Novikov" },
]
maintainers = [
    { name = "Novikov Laboratories LLC", email = "andrei@hobukob.ru" },
]
keywords = ["monitoring", "change-point detection", "CUSUM", "e-detector", "anomaly detection", "metrics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# the format of checkpoints (sequential-analysis.checkpoint/2) and the procedures' identities
# are part of the state on disk: a new minor version of the library is adopted deliberately
dependencies = ["sequential-analysis>=0.4,<0.5"]

[project.scripts]
sequentialist = "sequentialist.cli:main"

[project.urls]
Source = "https://github.com/andre-a-no/sequentialist"
Library = "https://github.com/andre-a-no/sequential-analysis"

[tool.setuptools.dynamic]
version = { attr = "sequentialist.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src/sequentialist"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
